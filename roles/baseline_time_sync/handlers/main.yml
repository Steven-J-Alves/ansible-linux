---
- name: Restart chrony (Debian)
  ansible.builtin.service:
    name: chrony
    state: restarted
  listen: restart chrony
  when: ansible_facts['os_family'] == 'Debian'

- name: Restart chronyd (RedHat)
  ansible.builtin.service:
    name: chronyd
    state: restarted
  listen: restart chrony
  when: ansible_facts['os_family'] == 'RedHat'
