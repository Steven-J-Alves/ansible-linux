---
- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
  listen: restart auditd
  register: baseline_audit_restart_handler
  failed_when:
    - baseline_audit_restart_handler.failed
    - '"Job for auditd.service failed" not in (baseline_audit_restart_handler.msg | default(""))'

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  listen: restart fail2ban
