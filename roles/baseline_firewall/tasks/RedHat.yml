---
# firewalld configuration for RedHat-family hosts.

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    enabled: true
    state: started
  when: baseline_firewall_enabled

- name: Allow inbound TCP ports (firewalld)
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ baseline_firewall_allowed_tcp_ports }}"

- name: Allow inbound UDP ports (firewalld)
  ansible.posix.firewalld:
    port: "{{ item }}/udp"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ baseline_firewall_allowed_udp_ports }}"
  when: baseline_firewall_allowed_udp_ports | length > 0
