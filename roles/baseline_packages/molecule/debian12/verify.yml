---
- name: Verify baseline_packages
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert unattended-upgrades is installed (Debian)
      ansible.builtin.shell:
        cmd: set -o pipefail && dpkg -l unattended-upgrades | grep -c "^ii"
        executable: /bin/bash
      register: baseline_packages_uu_installed
      changed_when: false
      failed_when: baseline_packages_uu_installed.rc != 0
      when: ansible_facts['os_family'] == 'Debian'

    - name: Assert unattended-upgrades service is running (Debian)
      ansible.builtin.assert:
        that:
          - "'unattended-upgrades.service' in ansible_facts.services"
          - "ansible_facts.services['unattended-upgrades.service'].state == 'running'"
        fail_msg: "unattended-upgrades service is not running"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Check dnf-automatic timer is enabled (RedHat)
      ansible.builtin.stat:
        path: /etc/dnf/automatic.conf
      register: baseline_packages_dnf_conf
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert dnf-automatic config exists (RedHat)
      ansible.builtin.assert:
        that:
          - baseline_packages_dnf_conf.stat.exists
        fail_msg: "dnf-automatic config not found"
      when: ansible_facts['os_family'] == 'RedHat'
