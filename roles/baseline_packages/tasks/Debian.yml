---
# Debian-family package management: apt + unattended-upgrades.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install extra packages
  ansible.builtin.apt:
    name: "{{ baseline_packages_extra }}"
    state: present
  when: baseline_packages_extra | length > 0

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: baseline_packages_auto_update_enabled

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: baseline_packages_auto_update_enabled
  notify: reconfigure unattended-upgrades

- name: Enable unattended-upgrades service
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
  when: baseline_packages_auto_update_enabled
