---
- name: Restart sshd (Debian)
  ansible.builtin.service:
    name: ssh
    state: restarted
  listen: restart sshd
  when: ansible_facts['os_family'] == 'Debian'

- name: Restart sshd (RedHat)
  ansible.builtin.service:
    name: sshd
    state: restarted
  listen: restart sshd
  when: ansible_facts['os_family'] == 'RedHat'
