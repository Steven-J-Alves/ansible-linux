---
# Public API for baseline_tuning. All variables prefixed baseline_tuning_.

# I/O scheduler for SSDs. PERFORMANCE-TUNED.
# none/noop for NVMe SSDs; mq-deadline for SATA SSDs; bfq for HDDs.
baseline_tuning_io_scheduler: "none"

# Block device to apply scheduler to. ENVIRONMENT-DEPENDENT.
# Check with: cat /sys/block/*/queue/scheduler
baseline_tuning_io_block_device: ""

# sysctl tuning parameters. PERFORMANCE-TUNED.
# These complement the security params in baseline_kernel.
baseline_tuning_sysctl_params:
  # TCP performance
  net.core.somaxconn: 65535
  net.ipv4.tcp_max_tw_buckets: 1440000
  net.ipv4.tcp_tw_reuse: 1
  net.ipv4.tcp_fin_timeout: 15
  net.core.rmem_max: 16777216
  net.core.wmem_max: 16777216
  net.ipv4.tcp_rmem: "4096 87380 16777216"
  net.ipv4.tcp_wmem: "4096 65536 16777216"
  # Memory
  vm.swappiness: 10
  vm.dirty_ratio: 15
  vm.dirty_background_ratio: 5
