---
dependency:
  name: galaxy
  requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: /project/roles
  config_options:
    defaults:
      stdout_callback: ansible.builtin.default
      result_format: yaml

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
